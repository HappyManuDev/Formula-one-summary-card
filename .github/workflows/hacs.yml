name: HACS validation

# Manual only for now: the card is not submitted to HACS yet. To validate it on every
# push again, add back push / pull_request / schedule triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      # Left on main on purpose: HACS documents it this way, the last tagged
      # release dates from 2022, and main runs the checks hacs/default applies today.
      - uses: hacs/action@main
        with:
          category: plugin
